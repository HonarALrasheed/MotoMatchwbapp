<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MotoMatch – Motorrad-Quiz: Finde dein perfektes Bike</title>

    <meta name="description" content="Welches Motorrad passt zu dir? MotoMatch findet in acht Fragen das passende Bike für deinen Führerschein (A1, A2, A) und dein Budget – aus über 1.000 Modellen, mit Händlerkarte und Community." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Eine Adresse fuer alle Varianten (www, ?reset=1, ?dm=…): Google soll nur diese fuehren. -->
    <link rel="canonical" href="https://motomatch.studio/" />

    <!-- Sagt Google, dass die Seite "MotoMatch" heisst. Den Namen fuehren auch ein
         franzoesischer Teile-Shop und mehrere andere Angebote — ohne diese Angabe
         ordnet Google die Suche nach "motomatch" eher denen zu. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "MotoMatch",
        "alternateName": ["MotoMatch Motorrad-Quiz", "motomatch.studio"],
        "url": "https://motomatch.studio/",
        "inLanguage": "de-DE",
        "description": "Motorrad-Quiz: In acht Fragen das passende Bike für deinen Führerschein (A1, A2, A) und dein Budget finden."
      }
    </script>

    <!-- Vollbild auf Mobilgeraeten: als installierte Web-App laeuft MotoMatch
         ohne Adress- und Reiterleiste. Chromium (Android) liest dafuer das
         Manifest, WebKit (iPhone — betrifft Safari, Chrome, Edge und Firefox
         gleichermassen) die apple-Metatags darunter; beide zusammen ergeben
         auf beiden Plattformen dasselbe Ergebnis. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- black-translucent zieht den Inhalt unter die Statusleiste, statt einen
         schwarzen Balken stehen zu lassen — zusammen mit viewport-fit=cover
         oben und den env(safe-area-inset-*)-Abstaenden in main.css. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MotoMatch" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MotoMatch" />
    <meta property="og:locale" content="de_DE" />
    <meta property="og:url" content="https://motomatch.studio/" />
    <meta property="og:title" content="MotoMatch – Motorrad-Quiz: Finde dein perfektes Bike" />
    <meta property="og:description" content="Welches Motorrad passt zu dir? MotoMatch findet in acht Fragen das passende Bike für deinen Führerschein (A1, A2, A) und dein Budget – aus über 1.000 Modellen, mit Händlerkarte und Community." />
    <meta property="og:image" content="https://motomatch.studio/bikes/sportbikes_trio.webp" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MotoMatch – Motorrad-Quiz: Finde dein perfektes Bike" />
    <meta name="twitter:description" content="Welches Motorrad passt zu dir? MotoMatch findet in acht Fragen das passende Bike für deinen Führerschein (A1, A2, A) und dein Budget – aus über 1.000 Modellen, mit Händlerkarte und Community." />
    <meta name="twitter:image" content="https://motomatch.studio/bikes/sportbikes_trio.webp" />

    <!-- Fonts: self-hosted via public/fonts/ + @font-face in main.css (kein Google-Request) -->
  </head>
  <body>
    <div id="landing"></div>

    <div id="bike-detail" style="display: none"></div>

    <div id="quiz-screen" style="display: none">
      <canvas id="moto-canvas"></canvas>
      <canvas id="gauge-canvas"></canvas>
      <div id="quiz-container"></div>
    </div>

    <div id="drop-container" style="display: none"></div>

    <div id="garage-container" style="display: none"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
